<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield / Badge -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#shieldGrad)" />
  
  <!-- GPS Waves or Signal Arc -->
  <path d="M 28 22 A 28 28 0 0 1 72 22" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />
  <circle cx="50" cy="18" r="3" fill="#10B981" />

  <!-- College Bus Body -->
  <g transform="translate(18, 28)">
    <!-- Bus Main Chassis -->
    <rect x="2" y="6" width="60" height="42" rx="8" fill="url(#busGrad)" stroke="#B45309" stroke-width="2" />
    
    <!-- Roof Flasher / Indicator -->
    <rect x="24" y="2" width="16" height="4" rx="2" fill="#EF4444" />
    
    <!-- Windshield & Side Windows -->
    <rect x="6" y="10" width="22" height="14" rx="3" fill="#0B192C" />
    <rect x="32" y="10" width="12" height="14" rx="2" fill="#0B192C" />
    <rect x="48" y="10" width="12" height="14" rx="2" fill="#0B192C" />
    
    <!-- Windshield reflection -->
    <path d="M 8 22 L 20 12 L 24 12 L 12 22 Z" fill="#38BDF8" opacity="0.6" />
    
    <!-- Front Grill / Bumper -->
    <rect x="0" y="38" width="64" height="8" rx="3" fill="#334155" />
    
    <!-- Headlights -->
    <circle cx="8" cy="42" r="3" fill="#FEF08A" />
    <circle cx="56" cy="42" r="3" fill="#FEF08A" />
    
    <!-- Center Campus Logo or Text -->
    <text x="32" y="32" font-size="7" font-weight="900" fill="#0B192C" text-anchor="middle" font-family="Arial, sans-serif">CAMPUS</text>
    
    <!-- Wheels -->
    <circle cx="14" cy="48" r="7" fill="#0F172A" />
    <circle cx="14" cy="48" r="3.5" fill="#94A3B8" />
    
    <circle cx="50" cy="48" r="7" fill="#0F172A" />
    <circle cx="50" cy="48" r="3.5" fill="#94A3B8" />
  </g>
</svg>

